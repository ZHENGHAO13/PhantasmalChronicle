<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phantasm Maker</title>
  <style>:root {
  color-scheme: light;
  --bg: #eee7dc;
  --surface: #fbf8f2;
  --surface-2: #f5efe5;
  --surface-3: #ece2d3;
  --line: #ded1be;
  --line-strong: #cbb89a;
  --text: #3f3426;
  --muted: #877866;
  --accent: #936b35;
  --accent-strong: #775329;
  --accent-soft: #efe0c8;
  --ok: #557a59;
  --warn: #9b6b2e;
  --danger: #a15049;
  --focus: rgba(147,107,53,.18);
  --shadow: 0 8px 24px rgba(79,61,39,.08);
  font-family: "Microsoft YaHei UI", "Segoe UI", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
body { background-image: linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0)),linear-gradient(90deg,rgba(111,91,64,.025) 1px,transparent 1px),linear-gradient(rgba(111,91,64,.025) 1px,transparent 1px); background-size:auto,28px 28px,28px 28px; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .5; }
input, select, textarea { width:100%; border:1px solid var(--line); background:#fffdf9; color:var(--text); border-radius:10px; padding:9px 11px; min-height:40px; outline:none; }
textarea { min-height:96px; resize:vertical; line-height:1.55; }
input:focus, select:focus, textarea:focus, button:focus-visible { border-color:var(--accent); box-shadow:0 0 0 3px var(--focus); outline:none; }
input[type="checkbox"] { width:18px; min-height:18px; accent-color:var(--accent); }
.app { min-height:100vh; display:grid; grid-template-columns:196px minmax(0,1fr); }
.sidebar { position:sticky; top:0; height:100vh; display:flex; flex-direction:column; border-right:1px solid var(--line); background:rgba(245,239,229,.96); }
.logo { padding:20px 16px 16px; border-bottom:1px solid var(--line); }
.logo strong { display:block; font-size:17px; }
.logo small { display:block; margin-top:5px; color:var(--muted); line-height:1.45; }
.nav { padding:12px 10px; display:flex; flex-direction:column; gap:5px; }
.nav button { border:0; background:transparent; color:#655744; min-height:42px; border-radius:9px; padding:0 12px; text-align:left; display:flex; align-items:center; gap:10px; }
.nav button:hover { background:rgba(147,107,53,.08); }
.nav button.active { color:#fffaf2; background:linear-gradient(180deg,#a07a46,#886231); }
.nav .mark { width:8px; height:8px; border:1px solid currentColor; transform:rotate(45deg); flex:0 0 auto; }
.side-footer { margin-top:auto; padding:12px; border-top:1px solid var(--line); display:grid; gap:9px; }
.side-footer select { min-height:36px; padding:6px 8px; }
.project-mini { border:1px solid var(--line); background:rgba(255,253,249,.65); padding:10px; border-radius:10px; }
.project-mini strong,.project-mini small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.project-mini small { margin-top:4px; color:var(--muted); }
.main { min-width:0; }
.topbar { min-height:64px; padding:10px 22px; border-bottom:1px solid var(--line); background:rgba(250,247,241,.94); display:flex; justify-content:space-between; align-items:center; gap:14px; position:sticky; top:0; z-index:20; backdrop-filter:blur(8px); }
.top-title h1 { font-size:18px; margin:0; }
.top-title p { font-size:12px; color:var(--muted); margin:4px 0 0; }
.top-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
.status-pill { display:inline-flex; align-items:center; gap:7px; min-height:32px; padding:0 10px; border-radius:999px; background:#fffaf3; border:1px solid var(--line); color:var(--muted); font-size:12px; }
.status-pill::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--muted); }
.status-pill.dirty { color:var(--warn); border-color:#d9bb8f; }
.status-pill.dirty::before { background:var(--warn); }
.status-pill.saved { color:var(--ok); border-color:#b8cdb7; }
.status-pill.saved::before { background:var(--ok); }
.btn { min-height:38px; border-radius:10px; padding:8px 13px; border:1px solid var(--line); background:#fffdf9; color:var(--text); }
.btn:hover { border-color:var(--line-strong); background:#f9f3ea; }
.btn.primary { color:#fffaf2; border-color:#8a6638; background:linear-gradient(180deg,#a07a46,#886231); }
.btn.primary:hover { background:linear-gradient(180deg,#aa8350,#906a37); }
.btn.danger { color:var(--danger); border-color:#dfbbb7; background:#fff8f7; }
.btn.small { min-height:32px; padding:5px 9px; font-size:12px; }
.content { padding:20px 22px 28px; }
.view { display:none; }
.view.active { display:block; }
.card { background:rgba(251,248,242,.96); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); }
.card-pad { padding:17px; }
.section-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:14px; }
.section-head h2,.section-head h3,.section-head p { margin:0; }
.section-head h2 { font-size:20px; }
.section-head h3 { font-size:16px; }
.section-head p { margin-top:5px; color:var(--muted); font-size:12px; line-height:1.5; }
.project-grid { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(260px,.6fr); gap:16px; align-items:start; }
.project-summary { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-top:14px; }
.stat { padding:13px; background:#fffaf4; border:1px solid var(--line); border-radius:12px; }
.stat span { display:block; color:var(--muted); font-size:12px; }
.stat strong { display:block; margin-top:4px; font-size:25px; }
.project-path { margin-top:12px; padding:11px; border-radius:10px; background:var(--surface-2); color:var(--muted); font-size:12px; overflow-wrap:anywhere; }
.issue-summary { display:flex; flex-direction:column; gap:8px; }
.issue-row { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:9px; align-items:start; padding:10px; border:1px solid var(--line); background:#fffdf9; border-radius:10px; }
.issue-dot { width:8px; height:8px; margin-top:5px; border-radius:50%; background:var(--warn); }
.issue-row.error .issue-dot { background:var(--danger); }
.issue-row.ok .issue-dot { background:var(--ok); }
.issue-row p { margin:0; color:var(--muted); font-size:12px; line-height:1.5; }
.editor-layout { display:grid; grid-template-columns:310px minmax(0,1fr); gap:16px; align-items:start; }
.editor-layout > div:first-child { position:sticky; top:84px; max-height:calc(100vh - 106px); align-self:start; min-width:0; }
.list-card { position:static; max-height:inherit; display:flex; flex-direction:column; overflow:hidden; }
.list-toolbar { padding:14px; border-bottom:1px solid var(--line); display:grid; gap:9px; }
.list-toolbar-row { display:flex; gap:7px; }
.list-body { padding:9px; overflow:auto; flex:1 1 auto; min-height:0; }
.list-item { width:100%; text-align:left; border:1px solid transparent; background:transparent; border-radius:10px; padding:10px 11px; margin-bottom:5px; color:var(--text); }
.list-item:hover { background:var(--surface-2); }
.list-item.active { background:var(--accent-soft); border-color:#d6bc94; }
.list-item strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.list-item small { display:block; color:var(--muted); margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.quest-list-entry { display:grid; gap:5px; margin-bottom:6px; }
.quest-list-row { display:grid; grid-template-columns:minmax(0,1fr) 34px; gap:5px; align-items:stretch; }
.quest-list-row .list-item { margin-bottom:0; min-width:0; }
.quest-list-toggle { min-height:100%; padding:0; display:grid; place-items:center; font-weight:800; }
.quest-phase-list { display:grid; gap:3px; margin-left:15px; padding:3px 0 4px 9px; border-left:2px solid var(--line); }
.quest-phase-item { width:100%; min-height:34px; padding:6px 9px; border:1px solid transparent; border-radius:8px; background:transparent; color:var(--muted); text-align:left; display:grid; grid-template-columns:auto minmax(0,1fr); gap:7px; align-items:center; font-size:12px; }
.quest-phase-item:hover { color:var(--text); background:var(--surface-2); border-color:var(--line); }
.quest-phase-item.active { color:var(--text); background:var(--accent-soft); border-color:var(--line-strong); }
.quest-phase-item span { white-space:nowrap; }
.quest-phase-item strong { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.editor-card { min-width:0; }
.editor-inner { padding:18px; }
.empty { min-height:360px; display:grid; place-items:center; text-align:center; color:var(--muted); padding:30px; }
.help { margin-bottom:15px; padding:12px 14px; border:1px solid #dac5a5; border-radius:12px; background:#f8eddb; color:#6d5331; line-height:1.55; font-size:13px; }
.help strong { display:block; margin-bottom:3px; color:#594124; }
.form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
.field { display:flex; flex-direction:column; gap:6px; min-width:0; }
.field > span:first-child { font-size:12px; color:#685b49; font-weight:600; }
.field-help { font-size:11px; color:var(--muted); line-height:1.5; }
.full { grid-column:1 / -1; }
.check-field { display:flex; align-items:center; gap:8px; min-height:40px; color:#685b49; font-size:13px; }
.subsection { margin-top:18px; padding-top:16px; border-top:1px solid var(--line); }
.subsection-title { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
.subsection-title h3,.subsection-title h4 { margin:0; font-size:15px; }
details.advanced { margin-top:17px; border:1px solid var(--line); border-radius:12px; background:#fffaf4; }
details.advanced > summary { cursor:pointer; padding:11px 13px; font-size:13px; font-weight:700; color:#705a3b; }
details.advanced[open] > summary { border-bottom:1px solid var(--line); }
.advanced-body { padding:13px; }
.stack { display:flex; flex-direction:column; gap:10px; }
.fold { border:1px solid var(--line); background:#fffdf9; border-radius:12px; overflow:hidden; }
.fold > summary { list-style:none; cursor:pointer; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:center; min-height:46px; padding:10px 12px; }
.fold > summary::-webkit-details-marker { display:none; }
.fold > summary:hover { background:var(--surface-2); }
.fold-title strong { display:block; }
.fold-title small { display:block; margin-top:3px; color:var(--muted); }
.fold-body { padding:13px; border-top:1px solid var(--line); }
.row-actions { display:flex; gap:7px; flex-wrap:wrap; justify-content:flex-end; }
.inline-list { display:flex; flex-direction:column; gap:8px; }
.inline-row { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:7px; align-items:center; }
.inline-row.three { grid-template-columns:minmax(0,1fr) 100px auto; }
.badge { display:inline-flex; align-items:center; min-height:24px; padding:0 8px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); color:var(--muted); font-size:11px; }
.condition { border-left:3px solid #c6a778; }
.action-card { border-left:3px solid #9e8259; }
.objective { border-left:3px solid #8aa083; }
.node-card { border-left:3px solid #899bb0; }
.spawn-card { border-left:3px solid #a68d69; }
.economy-tabs { display:flex; gap:7px; margin-bottom:14px; }
.economy-tabs button { min-height:36px; border-radius:9px; border:1px solid var(--line); background:#fffdf9; padding:0 13px; color:var(--muted); }
.economy-tabs button.active { color:#fffaf2; background:#906a37; border-color:#906a37; }
.validate-layout { display:grid; grid-template-columns:minmax(300px,.72fr) minmax(0,1.28fr); gap:16px; align-items:start; }
.validate-actions { display:flex; gap:8px; flex-wrap:wrap; }
.file-list { margin-top:13px; display:flex; flex-direction:column; gap:5px; max-height:320px; overflow:auto; }
.file-button { width:100%; border:1px solid var(--line); background:#fffdf9; border-radius:9px; padding:8px 10px; text-align:left; color:var(--muted); overflow-wrap:anywhere; }
.file-button.active { border-color:#c5a675; background:var(--accent-soft); color:var(--text); }
.preview { min-height:560px; max-height:calc(100vh - 125px); overflow:auto; margin:0; padding:15px; border-radius:12px; border:1px solid var(--line); background:#332b22; color:#f0e8dd; font:12px/1.6 Consolas,"Cascadia Mono",monospace; white-space:pre-wrap; word-break:break-word; }
.notice { position:fixed; right:18px; bottom:18px; width:min(420px,calc(100vw - 36px)); z-index:50; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:#fffdf9; box-shadow:0 14px 40px rgba(63,48,31,.16); display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:start; }
.notice[hidden] { display:none; }
.notice.ok { border-color:#afc7ae; color:var(--ok); }
.notice.warn { border-color:#dac093; color:var(--warn); }
.notice.error { border-color:#ddb2ae; color:var(--danger); }
.notice button { border:0; background:transparent; color:inherit; font-size:18px; }
.muted { color:var(--muted); }
.mini-note { color:var(--muted); font-size:12px; line-height:1.55; margin:8px 0 0; }
.separator { height:1px; background:var(--line); margin:13px 0; }
@media (max-width:1040px) {
  .app { grid-template-columns:166px minmax(0,1fr); }
  .editor-layout,.project-grid,.validate-layout { grid-template-columns:1fr; }
  .editor-layout > div:first-child { position:static; max-height:none; }
  .list-card { position:static; max-height:none; }
  .list-body { max-height:300px; }
}
@media (max-width:720px) {
  .app { grid-template-columns:1fr; }
  .sidebar { position:static; height:auto; }
  .logo,.side-footer { display:none; }
  .nav { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); }
  .nav button { justify-content:center; padding:0 7px; }
  .topbar { position:static; flex-direction:column; align-items:stretch; padding:10px 12px; }
  .top-actions { justify-content:stretch; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); }
  .top-actions .status-pill { grid-column:1 / -1; }
  .content { padding:14px 12px 20px; }
  .form-grid,.project-summary { grid-template-columns:1fr; }
}

/* Task editor: phases and objectives are deliberately non-collapsible. */
.task-phase-stack { gap: 0; }
.task-phase-connector { display:grid; place-items:center; min-height:38px; color:var(--accent); font-weight:800; }
.task-phase-connector::before { content:"↓"; display:grid; place-items:center; width:28px; height:28px; border:1px solid #d8c9b2; border-radius:999px; background:#fffaf4; }
.task-phase-card {
  border: 1px solid #d8c9b2;
  border-radius: 14px;
  background: #fffaf4;
  overflow: hidden;
  scroll-margin-top: 84px;
}
.task-objective-stack { gap: 12px; }
.task-objective-card {
  border: 1px solid #e1d4c1;
  border-radius: 12px;
  background: #fffdf9;
  overflow: hidden;
}
.task-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 13px;
  border-bottom: 1px solid var(--line);
  background: #f8f0e5;
}
.task-card-head.phase-head { background:#edf3f8; border-left:3px solid #758aa1; }
.task-card-head.objective-head { background:#edf4ef; border-left:3px solid #6f8d7c; }
.task-phase-index, .task-objective-index { font-weight: 800; color: #5d482d; }
.task-card-actions { display:flex; justify-content:flex-end; gap:6px; flex-wrap:wrap; }
.task-phase-card.focused { border-color:var(--accent); box-shadow:0 0 0 2px var(--focus); }
.task-card-body { padding: 14px; }
.task-phase-completion { display: contents; }
.task-reference-row { align-items: end; }
.task-reference-row > .field { flex: 1 1 auto; }
.task-inline-help {
  padding: 11px 12px;
  border: 1px solid #e4d7c5;
  border-radius: 10px;
  background: #fbf5ec;
  color: var(--muted);
  line-height: 1.65;
}
.task-structure-npc {
  padding: 11px 12px;
  border: 1px solid #e4d7c5;
  border-radius: 10px;
  background: #fbf7f0;
}
.tutorial-pages-editor { display:grid; gap:10px; }
.tutorial-page-card { border:1px solid var(--line); border-radius:11px; background:var(--surface-2); overflow:hidden; }
.tutorial-page-head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 10px; border-bottom:1px solid var(--line); background:var(--surface-3); }
.tutorial-page-body { display:grid; gap:10px; padding:11px; }
.tutorial-image-row { display:grid; grid-template-columns:minmax(0,240px) minmax(180px,1fr); gap:12px; align-items:start; }
.tutorial-image-preview { min-height:128px; display:grid; place-items:center; border:1px dashed var(--line-strong); border-radius:9px; background:#0d1117; overflow:hidden; }
.tutorial-image-preview img { display:block; width:100%; max-height:240px; object-fit:contain; }
.tutorial-image-empty { padding:20px; color:var(--muted); text-align:center; }
.tutorial-image-actions { display:grid; gap:8px; align-content:start; }
.tutorial-file-input { width:100%; }
.tutorial-file-path { overflow-wrap:anywhere; color:var(--muted); font-size:12px; }
@media (max-width:760px) { .tutorial-image-row { grid-template-columns:1fr; } }
.task-structure-npc .form-grid { margin-top: 10px; }
.legacy-note {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 16px;
  padding: 11px 12px;
  border: 1px solid #d9c39f;
  border-radius: 10px;
  background: #fff6e8;
  color: #765b35;
}
@media (max-width: 700px) {
  .task-card-head, .legacy-note { align-items: stretch; flex-direction: column; }
  .task-reference-row { align-items: stretch; flex-direction: column; }
}

/* Dialogue editor: WYSIWYG cards are deliberately non-collapsible. */
.dialogue-step-stack{gap:18px}.dialogue-step-card{border:1px solid #d7c8b2;border-radius:14px;background:#fffaf4;overflow:hidden}.dialogue-step-body{padding:14px}.dialogue-mode-row{display:flex;gap:8px;margin-bottom:10px}.mode-chip{min-height:32px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;background:#fffdf9;color:var(--muted)}.mode-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}.dialogue-live-preview{padding:16px;border-radius:14px;border:1px solid #cdbb9e;background:linear-gradient(180deg,#3f382f,#2d2924);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}.dialogue-live-preview.briefing{background:#f1e7d8;color:var(--text)}.dialogue-speaker{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center;margin-bottom:12px}.dialogue-speaker span{font-size:12px;font-weight:700;color:#e9cf9e}.dialogue-live-preview.briefing .dialogue-speaker span{color:var(--accent)}.dialogue-speaker input{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.18);color:inherit;font-weight:800}.dialogue-live-preview.briefing .dialogue-speaker input{background:#fffdf9;border-color:var(--line);color:var(--text)}.dialogue-lines-live{display:flex;flex-direction:column;gap:8px}.dialogue-line-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.dialogue-line-row textarea{min-height:64px;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.16);color:inherit}.dialogue-live-preview.briefing .dialogue-line-row textarea{background:#fffdf9;border-color:var(--line);color:var(--text)}.dialogue-choice-preview{display:flex;flex-direction:column;gap:8px;margin-top:14px}.dialogue-choice-button{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);color:inherit;text-align:left}.dialogue-live-preview.briefing .dialogue-choice-button{background:#fffdf9;border-color:var(--line);color:var(--text)}.dialogue-choice-editor{border:1px solid var(--line);border-radius:12px;padding:13px;background:#fffdf9}.dialogue-choice-editor-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.dialogue-choice-editor-stack{gap:12px}


/* PHANTASM_DARK_THEME_ONLY */
:root {
  color-scheme: dark;
  --bg: #0f1115;
  --surface: #171a21;
  --surface-2: #1d212a;
  --surface-3: #242934;
  --line: #2f3542;
  --line-strong: #465064;
  --text: #e8ebf0;
  --muted: #9ba3b2;
  --accent: #5ea1ff;
  --accent-strong: #3f7fd8;
  --accent-soft: #172b46;
  --ok: #63d391;
  --warn: #e9b35f;
  --danger: #ff7a7a;
  --focus: rgba(94,161,255,.22);
  --shadow: 0 12px 32px rgba(0,0,0,.34);
  --select: #63d391;
  --select-soft: #173a2b;
  --select-line: #2f7b55;
}
html, body { background:var(--bg); color:var(--text); }
body {
  background-image:
    linear-gradient(rgba(255,255,255,.018),rgba(255,255,255,0)),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px);
}
input, select, textarea {
  background:#12161d;
  color:var(--text);
  border-color:var(--line);
}
input::placeholder, textarea::placeholder { color:#727b8b; }
select option { background:#12161d; color:var(--text); }
input:focus, select:focus, textarea:focus, button:focus-visible {
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--focus);

function searchFtbQuests(query) {

    const id=normalizeFtbQuestId(q.id);

    return {q,score};

function compactObject(value) {

  if (!value || typeof value !== "object") return value;

    if (v === undefined || v === null || v === "") continue;
    out[k]=compactObject(v);
  }
  return out;
}

}

async function sameManualImageBytes(a,b){
  if(a.size!==b.size||a.size>8*1024*1024)return false;
  const left=new Uint8Array(await a.arrayBuffer()),right=new Uint8Array(await b.arrayBuffer());
  if(left.length!==right.length)return false;
  for(let i=0;i<left.length;i++)if(left[i]!==right[i])return false;
  return true;
}
async function ensureManualImagesAvailable(){
  const manualDir=await ensureDir(state.projectHandle,["config","phantasmbriefing","manual_images"]);
  const legacyDir=await getOptionalDir(state.projectHandle,["config","phantasmbriefing","tutorial_images"]);
  for(const name of referencedManualImages()){
    if(!tutorialImageNameIsSafe(name))throw Error(`${t("manual.image")}: ${name}`);
    let current=null,old=null;
    try{current=await manualDir.getFileHandle(name);}catch{}
    if(legacyDir)try{old=await legacyDir.getFileHandle(name);}catch{}
    const existing=current?await current.getFile():null;
    if(existing&&existing.size>0){
      if(old&&!(await sameManualImageBytes(existing,await old.getFile())))
        throw Error(`${t("manual.image")}: ${name} — conflicting files, migration stopped`);
      await validateTutorialPng(existing);
      continue;
    }
    if(!old)throw Error(`${t("manual.image")}: ${name} — missing`);
    const original=await old.getFile();await validateTutorialPng(original);
    await copyHandleFile(old,manualDir,name);
    const copied=await (await manualDir.getFileHandle(name)).getFile();
    if(!(await sameManualImageBytes(original,copied)))throw Error(`${t("manual.image")}: ${name} — copy verification failed`);
  }
}

async function validateTutorialPng(file) {
  if(!file||file.size>8*1024*1024)throw new Error(t("tutorial.fileTooLarge"));
  const header=new Uint8Array(await file.slice(0,24).arrayBuffer());
  const pngSignature=[137,80,78,71,13,10,26,10];
  if(header.length!==24||pngSignature.some((value,index)=>header[index]!==value)||String.fromCharCode(...header.slice(12,16))!=="IHDR")throw new Error(t("tutorial.invalidPng"));
  const dimensions=new DataView(header.buffer,header.byteOffset,header.byteLength);
  const expectedWidth=dimensions.getUint32(16);
  const expectedHeight=dimensions.getUint32(20);
  if(expectedWidth<1||expectedHeight<1)throw new Error(t("tutorial.invalidPng"));
  if(expectedWidth>4096||expectedHeight>4096)throw new Error(t("tutorial.dimensionsTooLarge"));
  let bitmap;
  try { bitmap=await createImageBitmap(file); }
  catch { throw new Error(t("tutorial.invalidPng")); }
  try {
    if(bitmap.width!==expectedWidth||bitmap.height!==expectedHeight)throw new Error(t("tutorial.invalidPng"));
  } finally { bitmap.close(); }
}
async function copyTutorialImage(file) {
  await validateTutorialPng(file);
  const filename=await tutorialImageFilename(file);
  const dir=await ensureDir(state.projectHandle,["config","phantasmbriefing","manual_images"]);
  const handle=await dir.getFileHandle(filename,{create:true});
  const writable=await handle.createWritable();
  try { await writable.write(file); await writable.close(); }
  catch(error) { try { await writable.abort(); } catch {} throw error; }
  const oldUrl=state.ui.tutorialPreviewUrls[filename];
  if(oldUrl)try { URL.revokeObjectURL(oldUrl); } catch {}
  state.ui.tutorialPreviewUrls[filename]=URL.createObjectURL(file);
  return filename;
}

  const kind=currentEditorKind(button),record=findRecord(kind); if(!record)return;

  if(action==="manual-link-quest"&&kind==="quests"){

    if(!id){showNotice(t("manual.openManager"),"warn");return;}

  }
  if(action==="manual-unlink-quest"&&kind==="quests"){

  }
  if(action==="manual-move-quest"&&kind==="quests"){
    if(moveManualLink(record,Number(button.dataset.index),Number(button.dataset.direction))){setDirty();renderCurrentEditorPreserveScroll();}

  if(action==="manual-move"&&kind==="quests"){

  if(action==="manual-link"&&kind==="quests"){
    const obj=getPath(record,button.dataset.objectivePath);if(!obj)return;
    obj.manualIds=Array.isArray(obj.manualIds)?obj.manualIds:[];
    const id=state.data.manuals.find(m=>!obj.manualIds.includes(m.manualId))?.manualId;
    if(!id){showNotice(t("manual.openManager"),"warn");return;}
    addManualLink(obj,id);setDirty();renderCurrentEditorPreserveScroll();return;
  }
  if(action==="manual-create-link"&&kind==="quests"){
    const obj=getPath(record,button.dataset.objectivePath);if(!obj)return;
    const manual=makeManual();state.data.manuals.push(manual);

    state.selected.manuals=manual.manualId;setDirty();setView("manuals");return;
  }
  if(action==="manual-unlink"&&kind==="quests"){
    const obj=getPath(record,button.dataset.objectivePath);if(!obj)return;

  }
  if(kind==="manuals"){
    if(action==="manual-node-select"){state.ui.selectedManualNodeId=button.dataset.nodeId;renderCurrentEditorPreserveScroll();return;}
    if(action==="manual-node-add"){
      const chosen=manualSelectedNode(record),parent=chosen?.node.type==="group"?chosen:null;

      const list=parent?parent.node.children:record.sections;
      const id=uniqueNumbered(button.dataset.nodeType==="group"?"group_":"lesson_",manualNodeIds(record));
      list.push(button.dataset.nodeType==="group"?{type:"group",nodeId:id,title:t("manual.group"),children:[]}:{type:"lesson",nodeId:id,title:t("manual.lesson"),visibility:{questId:"",phaseId:""},pages:[{...makeTutorialPage(),pageId:uniqueNumbered("page_",allManualPages(record).map(p=>p.pageId))}]});
      state.ui.selectedManualNodeId=id;setDirty();renderCurrentEditorPreserveScroll();return;
    }
    if(action==="manual-node-move"){

      if(next<0||next>=found.parent.length)return;[found.parent[found.index],found.parent[next]]=[found.parent[next],found.parent[found.index]];setDirty();renderCurrentEditorPreserveScroll();return;

      if(state.data.quests.some(q=>[q,...q.phases.flatMap(p=>p.objectives)].some(o=>(o.manualIds||[]).some((id,i)=>id===record.manualId&&(!o.manualLessonIds?.[i]||ids.has(o.manualLessonIds[i])))))){showNotice(t("manual.deleteUsed"),"warn");return;}
      if(!window.confirm(t("msg.confirmDelete",{name:found.node.title})))return;
      found.parent.splice(found.index,1);state.ui.selectedManualNodeId="";setDirty();renderCurrentEditorPreserveScroll();return;
    }
    if(action==="manual-page-add"){
      if(manualSelectedLesson(record).pages.length>=50)return;manualSelectedLesson(record).pages.push({...makeTutorialPage(),pageId:uniqueNumbered("page_",allManualPages(record).map(page=>page.pageId))});setDirty();renderCurrentEditorPreserveScroll();return;
    }
    if(action==="manual-page-clone"){
      if(manualSelectedLesson(record).pages.length>=50)return;

    }
    if(action==="manual-remove-cover"){
      record.cover="";setDirty();renderCurrentEditorPreserveScroll();return;
    }
    if(action==="manual-page-move"){
      if(moveTutorialPage({tutorialPages:manualSelectedLesson(record)?.pages},Number(button.dataset.index),Number(button.dataset.direction))){setDirty();renderCurrentEditorPreserveScroll();}return;
    }
    if(action==="manual-page-remove"){
      if(manualSelectedLesson(record).pages.length<=1)return;manualSelectedLesson(record).pages.splice(Number(button.dataset.index),1);setDirty();renderCurrentEditorPreserveScroll();return;
    }
    if(action==="manual-remove-image"){
      const page=manualSelectedLesson(record).pages[Number(button.dataset.index)];if(!page)return;page.image="";setDirty();renderCurrentEditorPreserveScroll();return;
    }
  }
  if(action==="tutorial-page-add"){
    const obj=getPath(record,button.dataset.objectivePath);if(!obj)return;obj.tutorialPages=Array.isArray(obj.tutorialPages)?obj.tutorialPages:[];if(obj.tutorialPages.length>=50)return;obj.tutorialPages.push(makeTutorialPage());setDirty();renderCurrentEditorPreserveScroll();return;
  }
  if(action==="tutorial-page-clone"){
    const obj=getPath(record,button.dataset.objectivePath),index=Number(button.dataset.index);if(!obj||!Array.isArray(obj.tutorialPages)||obj.tutorialPages.length>=50||!obj.tutorialPages[index])return;obj.tutorialPages.splice(index+1,0,clone(obj.tutorialPages[index]));setDirty();renderCurrentEditorPreserveScroll();return;
  }
  if(action==="tutorial-page-move"){
    const obj=getPath(record,button.dataset.objectivePath);if(!moveTutorialPage(obj,Number(button.dataset.index),Number(button.dataset.direction)))return;setDirty();renderCurrentEditorPreserveScroll();return;
  }
  if(action==="tutorial-page-remove"){
    const obj=getPath(record,button.dataset.objectivePath),index=Number(button.dataset.index);if(!obj||!Array.isArray(obj.tutorialPages)||obj.tutorialPages.length<=1)return;obj.tutorialPages.splice(index,1);setDirty();renderCurrentEditorPreserveScroll();return;
  }
  if(action==="tutorial-image-remove"){
    const obj=getPath(record,button.dataset.objectivePath),page=obj?.tutorialPages?.[Number(button.dataset.index)];if(!page)return;page.image="";setDirty();renderCurrentEditorPreserveScroll();return;
  }
  if(action==="quest-add-prereq"){ const value=button.dataset.source==="pb"?state.data.quests.find(q=>q.questId!==record.questId&&!record.parentQuestIds.includes(q.questId))?.questId||"":state.ftbQuests.find(q=>!record.parentQuestIds.includes(q.id))?.id||""; if(value)record.parentQuestIds.push(value); else if(button.dataset.source==="ftb")record.parentQuestIds.push(""); setDirty(); renderCurrentEditorPreserveScroll(); return; }
  if(action==="quest-remove-prereq"){record.parentQuestIds.splice(Number(button.dataset.index),1);setDirty();renderCurrentEditorPreserveScroll();return;}
  if(action==="quest-auto-layout"){record.treeLayout=null;setDirty();renderCurrentEditorPreserveScroll();return;}
  if(action==="clone-phase"){
    const copy=cloneQuestPhase(record,Number(button.dataset.index));if(!copy)return;setDirty();state.ui.focusedQuestPhaseId=copy.phaseId;setQuestListExpanded(record.questId,true);renderCurrentList("quests");renderCurrentEditorPreserveScroll();return;
  }
  if(action==="clone-objective"){
    const copy=cloneQuestObjective(record,Number(button.dataset.phaseIndex),Number(button.dataset.index));if(!copy)return;setDirty();renderCurrentEditorPreserveScroll();return;
  }
  if(action==="move-phase"){
    const index=Number(button.dataset.index),direction=Number(button.dataset.direction);if(!moveQuestPhase(record,index,direction))return;state.ui.focusedQuestPhaseId=record.phases[index+direction]?.phaseId||"";setDirty();renderCurrentList("quests");renderCurrentEditorPreserveScroll();return;
  }
  if(action==="dialogue-entry-toggle"){
    if(kind!=="dialogues")return;const index=Number(button.dataset.index),node=record.nodes[index];if(!node)return;record.entryNodeIds=Array.isArray(record.entryNodeIds)?record.entryNodeIds:[];const pos=record.entryNodeIds.indexOf(node.nodeId);if(pos>=0)record.entryNodeIds.splice(pos,1);else record.entryNodeIds.push(node.nodeId);if(!record.entryNodeIds.length)record.entryNodeIds.push(node.nodeId);record.startNodeId=record.entryNodeIds[0]||node.nodeId;setDirty();renderCurrentList("dialogues");renderCurrentEditorPreserveScroll();return;
  }
  if(action==="dialogue-move-node"){
    if(kind!=="dialogues")return;const index=Number(button.dataset.index),direction=Number(button.dataset.direction),next=index+direction;if(index<0||next<0||index>=record.nodes.length||next>=record.nodes.length)return;const [node]=record.nodes.splice(index,1);record.nodes.splice(next,0,node);const entrySet=new Set(record.entryNodeIds||[]);record.entryNodeIds=record.nodes.map(n=>n.nodeId).filter(id=>entrySet.has(id));record.startNodeId=record.entryNodeIds[0]||record.nodes[0]?.nodeId||"root";setDirty();renderCurrentList("dialogues");renderCurrentEditorPreserveScroll();return;
  }
  if(action==="array-add"){

    const path=button.dataset.path; const array=getPath(record,path); if(!Array.isArray(array))setPath(record,path,[]); const targetArray=getPath(record,path); const previous=kind==="quests"&&path==="phases"&&targetArray.length?targetArray[targetArray.length-1]:null; const created=arrayFactory(button.dataset.factory,record,path,button); targetArray.push(created); if(kind==="quests"&&path==="phases"){if(!record.initialPhaseId)record.initialPhaseId=created.phaseId;if(previous){previous.nextPhaseId=created.phaseId;previous.completeQuestOnObjectivesCompleted=false;}created.completeQuestOnObjectivesCompleted=true;state.ui.focusedQuestPhaseId=created.phaseId;renderCurrentList("quests");} setDirty(); renderCurrentEditorPreserveScroll(); return;
  }
  if(action==="array-remove"){
    const path=button.dataset.path,array=getPath(record,path),index=Number(button.dataset.index);

      setDirty();
      renderCurrentEditorPreserveScroll();
      return;
    }
    const removed=Array.isArray(array)?array[index]:null;
    if(Array.isArray(array))array.splice(index,1);
    if(kind==="dialogues"&&path==="nodes"&&removed){record.entryNodeIds=(record.entryNodeIds||[]).filter(id=>id!==removed.nodeId);if(!record.entryNodeIds.length&&record.nodes[0])record.entryNodeIds=[record.nodes[0].nodeId];record.startNodeId=record.entryNodeIds[0]||record.nodes[0]?.nodeId||"root";for(const node of record.nodes){if(node.nextNodeId===removed.nodeId)node.nextNodeId="";for(const choice of node.choices||[])if(choice.nextNodeId===removed.nodeId)choice.nextNodeId="";}}
    setDirty();if(kind==="dialogues"&&path==="nodes"){if(state.ui.focusedDialogueNodeId===removed?.nodeId)state.ui.focusedDialogueNodeId="";renderCurrentList("dialogues");} renderCurrentEditorPreserveScroll(); return;
  }
  if(action==="set-item"){setPath(record,button.dataset.path,makeItem("minecraft:emerald",1));setDirty();renderCurrentEditor();return;}
  if(action==="set-marker"){setPath(record,button.dataset.path,{label:"",dimension:"minecraft:overworld",x:0,y:64,z:0});setDirty();renderCurrentEditor();return;}
  if(action==="clear-object"){setPath(record,button.dataset.path,null);setDirty();renderCurrentEditor();return;}

document.addEventListener("pointerdown", event => {
  if(event.target.closest(".ftb-quest-search-option"))event.preventDefault();
});
document.addEventListener("click", event => {
  if(event.target.closest(".ftb-quest-search-field"))return;
  document.querySelectorAll(".ftb-quest-search-results:not([hidden])").forEach(box=>{box.hidden=true;box.innerHTML="";});
});
document.addEventListener("keydown", event => {
  const input=event.target.closest?.('input[data-special="ftb-quest-search"]');
  if(!input)return;
  const path=input.dataset.path;
  const results=input.closest(".ftb-quest-search-field")?.querySelector(`[data-ftb-search-results="${CSS.escape(path)}"]`);
  if(event.key==="Escape"){if(results){results.hidden=true;results.innerHTML="";}return;}
  if(event.key==="Enter"&&results&&!results.hidden){
    const first=results.querySelector(".ftb-quest-search-option");
    if(first){event.preventDefault();first.click();}
  }
});
document.addEventListener("input", event => {
  const el=event.target;
  if(el.dataset.special==="ftb-quest-search"){updateFtbSearchInput(el);return;}
  if(el.matches("[data-search-kind]")){
    const kind=el.dataset.searchKind;state.ui.filters[kind]=el.value;const card=el.closest(".list-card");const query=el.value.trim().toLowerCase();const selector=kind==="quests"?".quest-list-entry":kind==="dialogues"?".dialogue-list-entry":".list-item";card?.querySelectorAll(selector).forEach(item=>{const text=item.dataset.searchText||item.textContent.toLowerCase();item.hidden=Boolean(query&&!text.includes(query));});if(kind==="quests")card?.querySelectorAll(".quest-reorder").forEach(btn=>{btn.disabled=Boolean(query)||((btn.dataset.direction==="-1"&&btn.closest(".quest-list-entry")===card.querySelector(".quest-list-entry"))||(btn.dataset.direction==="1"&&btn.closest(".quest-list-entry")===card.querySelector(".quest-list-entry:last-child")));});return;
  }
  if(el.matches("[data-bind-lines]")){updateLines(el);return;}
  if(el.matches("[data-bind]")&&el.tagName!=="SELECT"&&el.type!=="checkbox"&&!el.dataset.idField)updateBound(el);
});

document.addEventListener("change", async event => {
  const el=event.target;
  if(el.dataset.special==="manual-image-file"||el.dataset.special==="manual-cover-file"){await handleManualImageSelect(el);return;}
  if(el.dataset.special==="objective-manual-image-file"){await handleObjectiveManualImageSelect(el);return;}
  if(el.dataset.special==="manual-visibility-mode"){
    const manual=findRecord("manuals"),node=manual&&getPath(manual,el.dataset.nodePath);if(!node)return;
    node.visibility=el.value==="phase"?{questId:state.data.quests[0]?.questId||"",phaseId:state.data.quests[0]?.phases?.[0]?.phaseId||""}:{questId:"",phaseId:""};setDirty();renderCurrentEditorPreserveScroll();return;
  }
  if(handleSpecialChange(el))return;
  if(el.matches("[data-multi-bind]")){
    const kind=currentEditorKind(el),record=findRecord(kind);if(!record)return;const path=el.dataset.multiBind;const values=new Set(getPath(record,path)||[]);if(el.checked)values.add(el.value);else values.delete(el.value);setPath(record,path,[...values]);setDirty();return;
  }
  if(el.matches("[data-bind]"))updateBound(el);
});

$("#languageSelect").addEventListener("change", event => {state.ui.language=event.target.value==="en"?"en":"zh";persistPrefs();applyI18n();setView(state.activeView);renderWorkspaceState();});
window.addEventListener("beforeunload", event => {if(!state.ui.dirty)return;event.preventDefault();event.returnValue="";});

function init() {
  loadPrefs(); applyI18n(); renderWorkspaceState(); setView("project");
}
init();
